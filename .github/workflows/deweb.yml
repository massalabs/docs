name: DeWeb deployer

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two uploads in parallel: runs wait for the current upload,
# and a newer push replaces any queued run so only the latest main is deployed.
# The group is not per-branch since every run updates the same website.
# Never cancel a running upload, it would leave the website half updated.
concurrency:
  group: deweb-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DeWeb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm

      - name: Download config files from Massa testnet branch
        run: ./scripts/download-configs.sh

      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build

      - name: Deploy to Massa DeWeb
        id: deploy
        uses: massalabs/deweb-gh-action@v0.1.2
        with:
          config_file: deweb_cli_config.mainnet.json
          source_folder: ./build
        env:
            MASSA_DEWEB_SECRET_KEY: ${{ secrets.MASSA_DEWEB_MAINNET_PKEY }}

      - name: Get deployed website address
        run: |
          echo "Deployed website address: ${{ steps.deploy.outputs.deployed-website }}"
